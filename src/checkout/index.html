<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout-container">
        <h2 class="form-title">Review & Place your Order</h2>
        <!-- CHECKOUT FORM -->
        <form id="checkoutForm" class="checkout-form">
          <input type="hidden" name="orderDate" id="orderDate">
          <fieldset>
            <legend>Your Information</legend>

            <label class="field-label" for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required>

            <label class="field-label" for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required>
          </fieldset>
          <fieldset>
            <legend>Billing Information</legend>

            <label class="field-label" for="street">Street Address</label>
            <input type="text" id="street" name="street" required>

            <label class="field-label" for="city">City</label>
            <input type="text" id="city" name="city" required>

            <label class="field-label" for="state">State</label>
            <input type="text" id="state" name="state" required>

            <label class="field-label" for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required>
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>

            <label class="field-label" for="cardNumber">Credit Card Number</label>
            <input value="7777777777777" type="text" id="cardNumber" name="cardNumber" required>

            <label class="field-label" for="expiration">Expiration Date</label>
            <input value="12/30" type="text" id="expiration" name="expiration" required>

            <label class="field-label" for="code">Security Code</label>
            <input value="222" type="text" id="code" name="code" minlength="3" maxlength="3" required>
          </fieldset>

          <button type="submit" id="checkoutSubmit" class="primary-btn confirm-checkout">Confirm Purchase</button>
        </form>
        <aside class="aside-container order-summary"  id="order-summary">
          <h2>Order Summary</h2>
          <p id="num-items"></p>
          <p id="subtotal"></p>
          <p id="tax"></p>
          <p id="shipping"></p>
          <p id="total"></p>
        </aside>
        <section class="checkout-actions">
          <a href="../cart/index.html" class="primary-btn">← Back to Cart</a>
        </section>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
