<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <h2>Review & Place your Order</h2>
      <section class="checkout-form">
        <form name="checkout">
          <input type="hidden" name="orderDate" id="orderDate" />

          <fieldset>
            <legend></legend>
            <div class="checkout__name">
              <label for="fname">First Name</label>
              <input type="text" name="fname" id="fname" required />
              <label for="lname">Last Name</label>
              <input type="text" name="lname" id="lname" required />
            </div>
            <!-- Credit card, Zip code, and CVV formatting rules -->
            <div class="checkout__address">
              <label for="street">Street Address</label>
              <input type="text" name="street" id="street" required />

              <label for="city">City</label>
              <input type="text" name="city" id="city" required />

              <label for="state">State</label>
              <input
                type="text"
                name="state"
                id="state"
                required
                maxlength="2"
                placeholder="OR"
              />

              <label for="zip">Zip Code</label>
              <input
                type="text"
                name="zip"
                id="zip"
                required
                pattern="^\d{5}(-\d{4})?$"
                title="5-digit US ZIP Code"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="checkout__payment">
              <label for="cardNumber">Card Number</label>
              <input
                type="text"
                name="cardNumber"
                id="cardNumber"
                required
                pattern="^\d{16}$"
                title="16-digit credit card number"
                placeholder="1234123412341234"
              />

              <label for="expiration">Expiration (MM/YY)</label>
              <input
                type="text"
                name="expiration"
                id="expiration"
                required
                pattern="^(0[1-9]|1[0-2])\/\d{2}$"
                placeholder="05/28"
              />

              <label for="code">CVV Security Code</label>
              <input
                type="text"
                name="code"
                id="code"
                required
                pattern="^\d{3,4}$"
                title="3 or 4-digit security code"
                placeholder="123"
              />
            </div>
          </fieldset>

          <fieldset class="checkout-summary">
            <legend>Order Summary</legend>

            <div class="order__summary">
              <div>Items</div>
              <div id="num-items"></div>
              <div>Subtotal</div>
              <div id="cartTotal"></div>
              <div>Tax</div>
              <div id="tax"></div>
              <div>Shipping</div>
              <div id="shipping"></div>
              <div>Total</div>
              <div id="orderTotal"></div>
            </div>
          </fieldset>
          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
