<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Make and Name</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h2>Brand Name</h2>

        <a href="../product_listing/index.html?category=tents">
          <p class="back-to-products">Back to Products Lists</p>
        </a>

        <h3 class="divider">Product</h3>
        <img
          src="../images/camping-products.jpg"
          alt="Sleep Outside Camping Products"
          id="productImage"
          class="divider"
        />
        <p id="productDesc" class="product__description">Description</p>
        <div class="product-detail__prices" aria-label="Product pricing">
          <p class="product-detail__retail-price">
            Regular price: <span id="productRetailPrice">$000.99</span>
          </p>
          <p class="product-detail__sale-price">
            Sale price: <span id="productPrice">$000.99</span>
          </p>
          <p id="productDiscount" class="product-detail__discount"></p>
        </div>
        <p id="productColor" class="product__color">Color</p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="productId">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
