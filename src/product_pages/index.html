<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Tent details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>
  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="Tent logo" />
        <a href="../index.html">Sleep<span class="highlight">Outside</span></a>
      </div>
      <div class="cart"><a href="../cart/">Cart</a></div>
    </header>
    <main class="divider">
      <section class="product-detail">
        <h2></h2>
        <h3 class="divider"></h3>
        <img id="productImage" class="divider" src="" alt="" />
        <div class="product-detail__prices" aria-label="Product pricing">
          <p class="product-detail__retail-price">Retail: <span id="productRetailPrice"></span></p>
          <p class="product-detail__sale-price">Sale: <span id="productPrice"></span></p>
          <p id="productDiscount" class="product-detail__discount"></p>
        </div>
        <p id="productColor" class="product__color"></p>
        <div id="productDesc" class="product__description"></div>
        <div class="product-detail__add">
          <button id="addToCart" type="button">Add to Cart</button>
        </div>
      </section>
    </main>
    <footer>&copy; SleepOutside</footer>
  </body>
</html>
